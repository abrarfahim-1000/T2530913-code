limits are exceeded to prevent instability and cascading failures."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_004", "label": "R_004\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_004\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e tap_changer_type == \u0027DETC\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e GSU transformer calculations must use the actual in-service tap for DETC to ensure accurate voltage modeling."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_006", "label": "R_006\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_006\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e re_dispatch_required AND facilities_within_ratings AND NOT non_consequential_load_loss\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text, Point 9\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Curtailment of Firm Transmission Service is allowed through re-dispatch if facilities remain within ratings and no non-consequential load loss occurs."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_008", "label": "R_008\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_008\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e relay_count == 1 AND alternative_relay_available == false\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Page 29 of 32\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e A single protective relay without an alternative may fail to clear faults within required times, risking equipment damage or safety hazards."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_013", "label": "R_013\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_013\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e non_consequential_load_loss_mw \u003e= 25\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e TPL-001-5.1 \u2014 Transmission System Planning Performance Requirements\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Non-Consequential Load Loss is allowed if the planned loss is at least 25 MW."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_016", "label": "R_016\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_016\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e operating_in_LFSM_U_mode AND reference_active_power_changed\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The LFSM-U reference active power must not be changed unless triggered by frequency restoration."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_020", "label": "R_020\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_020\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e delay_time_seconds \u003e 2\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e ENTSO-E AISBL, Table 5\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The initial delay of activation must be as short as possible, but can be longer if justified by technical evidence."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_023", "label": "R_023\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_023\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e activation_time_seconds \u003e 30\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e ENTSO-E, Page 31\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Ensures full activation time for active power frequency response does not exceed 30 seconds unless justified by system stability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_029", "label": "R_029\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_029\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e reactive_current_pu \u003c= 1.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e ENTSO-E AISBL, Article 15(2)(b) point 1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Reactive current contribution must not exceed the short-term dynamic current rating to prevent equipment damage."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_035", "label": "R_035\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_035\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e mho_relay_criteria_met == false\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Alternative relay methods (e.g., blenders, lenticular relays) may be required if mho relay cannot meet Table 1 criteria."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_036", "label": "R_036\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_036\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e power_factor_tolerance NOT DEFINED BY RELEVANT NETWORK OPERATOR\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e ENTSO-E, Article 15(2)(a), Article 16(3)(a) and (b)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Power factor target values and tolerances must be explicitly defined by the relevant network operator according to Article 4(3)."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_042", "label": "R_042\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_042\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e undamped_oscillations == true\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Article 10(2)(b)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Undamped oscillations after step change response are unsafe and must be prevented."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_043", "label": "R_043\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_043\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e active_power_pu BETWEEN (min_regulating_level/max_capacity) AND 1.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e FSM response test\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Power generating module must continuously modulate active power between minimum regulating level and maximum capacity for frequency control."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_047", "label": "R_047\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_047\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e headroom_mw \u003c max(5, 0.02*(HSL - PA_Capacity))\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BAL-001-TRE-2 \u2014 Primary Frequency Response in the ERCOT Region\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Inadequate up-headroom (less than 5MW or 2% of (HSL - PA Capacity)) prevents evaluation for low-frequency events."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_048", "label": "R_048\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_048\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e overcurrent_setting_percent \u003e 115 AND real_power_output_pct == 100 AND reactive_power_output_pct == 100\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Overcurrent protection settings must be set above 115% of calculated current derived from 100% real power and 100% reactive power outputs for Option 8c."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_049", "label": "R_049\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_049\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_restoration_capability == false\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Article 10(2)(c)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Requires the power generating module to demonstrate technical capability for frequency restoration control participation."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_051", "label": "R_051\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_051\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e overcurrent_current_pu \u003e 1.15 * (real_power_pu * 1.0 + reactive_power_pu * 1.0)\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text, Overcurrent Element Setting (Option 9c)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Overcurrent elements must be set above 115% of calculated current derived from real and reactive power thresholds (100% of maximum gross Mvar) to prevent false tripping."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_052", "label": "R_052\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_052\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e undamped_oscillations == false\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e ENTSO-E AISBL, Article 10(2)(c)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Undamped oscillations after a step change response are not allowed as they can destabilize the grid."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_053", "label": "R_053\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_053\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e initial_delay \u003c= required_delay\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e ENTSO-E AISBL, Article 10(2)(c)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The initial delay must comply with the requirements in Article 10(2)(c) to ensure timely frequency response."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_054", "label": "R_054\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_054\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e droop_setting within [min, max] AND deadband \u003c= tso_threshold\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e ENTSO-E AISBL, Article 10(2)(c)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Droop settings must remain within defined ranges, and deadband thresholds must not exceed those set by the TSO."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_055", "label": "R_055\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_055\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu == 1.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 Application Guidelines\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Transformer bus voltage must correspond to 1.0 per unit nominal voltage on the high-side winding to accommodate protection philosophy and prevent overcurrent relays from operating during dynamic conditions."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_056", "label": "R_056\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_056\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_bias_setting \u003c 0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The Frequency Bias Setting must be less than zero at all times to ensure proper regulation."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_062", "label": "R_062\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_062\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e output_reductions_per_year \u003c= 8 OR output_reductions_per_year \u003c= agreed_agr_unit_limit\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Issue 5 Revision 20 GD 20 February 2017\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Exceeding the annual output reduction limit may violate agreements with NGET and impact frequency control during low NRAPM periods."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_065", "label": "R_065\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_065\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e reactive_power_mvar \u003e 1.0 * aggregate_generation_mw\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 Application Guidelines, Page 53\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Reactive power output must not exceed 100% of aggregate generation MW for Option 15b to ensure proper overcurrent element settings."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_075", "label": "R_075\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_075\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e net_real_power_mw \u003e 1500\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e NERC standard BAL-002, Contingency Reserve requirements\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Ensures the Balancing Authority can utilize Contingency Reserve to balance resources and return Interconnection frequency within defined limits following a Reportable Disturbance."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_076", "label": "R_076\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_076\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e 51.0 AND frequency_hz \u003c= 51.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.6.1.3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Plant must operate for at least 90 minutes when frequency is between 51.0-51.5Hz."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_077", "label": "R_077\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_077\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e torque_angle \u003e 85\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 Application Guidelines, Example Calculations: Options 1b and 7b\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Exceeding maximum torque angle (MTA) of 85\u00b0 may compromise generator stability and synchronization."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_078", "label": "R_078\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_078\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e reactive_power_mvar \u003e= 1000\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Attachment 1, Criterion 2.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Facilities providing reactive resources must have a nameplate reactive power capability of at least 1000 MVARs to be considered critical for BES reliability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_079", "label": "R_079\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_079\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e= 47.0 AND frequency_hz \u003c 47.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.6.1.3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Plant must operate for at least 20 seconds when frequency is between 47.0-47.5Hz."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_086", "label": "R_086\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_086\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e p_mw \u003e 700.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 Application Guidelines\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Exceeding the rated real power capacity (700.0 MW) could damage generator equipment."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_087", "label": "R_087\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_087\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Line\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e loading_mva \u003e 3000\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e NERC\u2019s document \u2013 Refinement to Severity Risk Index\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e 765 kV line loading exceeding 3,000 MVA triggers an alert based on average MVA loading criteria."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_089", "label": "R_089\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_089\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 0.90 within 80ms OR voltage_pu \u003c 0.97 within 2s\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.6.1.7\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage drops exceeding 10% within 80ms or 3% within 2s violate rapid voltage change limits for grid stability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_090", "label": "R_090\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_090\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e flicker_severity_short_term \u003e 0.8 OR flicker_severity_long_term \u003e 0.6 (for \u003e132kV) OR flicker_severity_short_term \u003e 1.0 OR flicker_severity_long_term \u003e 0.8 (for \u003c=132kV)\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Engineering Recommendation P28\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Flicker severity thresholds must be adhered to prevent perceptible light flicker in electrical systems."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_094", "label": "R_094\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_094\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e 1.4\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e During single or two-phase-to-earth faults, phase-to-earth voltage may transiently rise to 140% in England and Wales."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_095", "label": "R_095\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_095\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e load_shed_mw \u003e= 300\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e SHED_LOAD\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Section 4.1.2.1.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Automatic load shedding of 300 MW or more is required to prevent overloads without human intervention."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_096", "label": "R_096\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_096\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e shed_load_mw \u003e= 300\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e SHED_LOAD\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e NERC Reliability Standard, Section 4.2.1.1.2; NERC or Regional Reliability Standard, Section 4.1.2.1.2; NERC Reliability Standards, Section 4.1.2.1.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Automatic load shedding of 300 MW or more is required to maintain system stability during underfrequency or undervoltage events without human intervention."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_099", "label": "R_099\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_099\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e p_mw \u003e 300\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e standards for UFLS program requirements\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e 300 MW is the historical threshold for allowable UFLS operational tolerances"}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_105", "label": "R_105\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_105\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e probability_exceedance_pct \u003e= 2.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Bilateral Agreement\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The probability of exceeding the agreed fault clearance time must be less than 2%."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_108", "label": "R_108\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_108\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_level_kV IN (400, 275) AND loading_during_fault_clearance \u003e 0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Issue 5 Revision 21 CC 21 March 2017, Page 149\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Protection systems must withstand loading during fault clearance on 400kV/275kV transmission systems without tripping to maintain discrimination with backup protections."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_112", "label": "R_112\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_112\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Line\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e current_pu \u003e 1.30\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e DISCONNECT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 Application Guidelines, Example Calculations: Options 18 and 19\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Secondary current must not exceed 130% of the base current."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_119", "label": "R_119\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_119\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e 1.05 AND voltage_pu \u003c 1.10\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-029-1 \u2013 Frequency and Voltage Ride-through Requirements for Inverter-based Resources, Table 1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generator must ride through for 1800 seconds in continuous operation region."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_120", "label": "R_120\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_120\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e= 0.90 AND voltage_pu \u003c= 1.05\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-029-1 \u2013 Frequency and Voltage Ride-through Requirements for Inverter-based Resources, Table 1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generator must ride through continuously in continuous operation region."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_123", "label": "R_123\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_123\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 0.50\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-029-1 \u2013 Frequency and Voltage Ride-through Requirements for Inverter-based Resources, Table 1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generator must ride through for 1.20 seconds in mandatory operation region."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_128", "label": "R_128\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_128\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e load_shed_mw \u003e= 100\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e SHED_LOAD\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e EOP-004-4 \u2013 Event Reporting\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Firm load shedding of 100 MW or more during a BES Emergency triggers automatic or manual load reduction."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_130", "label": "R_130\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_130\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e measurement_cycles \u003c 3 OR measurement_cycles \u003e 6\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-029-1 \u2013 Frequency and Voltage Ride-through Requirements for Inverter-based Resources, Attachment 2: Frequency Ride-Through Criteria, Note 2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Frequency measurements must be taken over 3\u20136 cycles at the high-side of the main transformer."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_131", "label": "R_131\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_131\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e filtering_length_ms \u003c 16.6\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-029-1 \u2013 Frequency and Voltage Ride-through Requirements for Inverter-based Resources, Attachment 2: Frequency Ride-Through Criteria, Note 1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Instantaneous trip settings with filtering lengths less than 16.6 ms are not permissible."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_135", "label": "R_135\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_135\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e number_of_bes_facilities_lost \u003e= 3 AND cause == \u0027common_disturbance\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e EOP-004-4 \u2013 Event Reporting, Page 514\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Unexpected loss of three or more BES facilities due to a common disturbance requires alerting."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_137", "label": "R_137\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_137\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e interpersonal_communication_available == false AND alternative_communication_available == false\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e EOP-004-4 \u2013 Event Reporting, Page 514\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Complete loss of both interpersonal and alternative communication systems requires immediate alerting."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_139", "label": "R_139\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_139\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e rho \u003e= -0.95 AND rho \u003c= 0.95\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Order No. 2003, pro forma LGIA\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Large generators must provide reactive power capability between 0.95 leading and 0.95 lagging at the Point of Interconnection to maintain bulk power system reliability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_141", "label": "R_141\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_141\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 1.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.A.4B.3.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Active power output must remain proportional to retained voltage during LV-side voltage dips."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_144", "label": "R_144\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_144\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e 52 AND duration_seconds \u003e 2\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e DISCONNECT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e To prevent unwanted island operation, non-synchronous generators must disconnect if frequency exceeds 52Hz for more than 2 seconds."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_145", "label": "R_145\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_145\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003c 47 AND duration_seconds \u003e 2\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e DISCONNECT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e To prevent unwanted island operation, non-synchronous generators must disconnect if frequency drops below 47Hz for more than 2 seconds."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_146", "label": "R_146\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_146\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e freeze_protection_meet_pct \u003c 100\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Requirement R2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Ensure that all generating units have freeze protection measures meeting the criteria to prevent cold-related failures."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_147", "label": "R_147\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_147\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e power_factor_pu \u003e= -0.95 AND power_factor_pu \u003c= 0.95\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Final Rule, Docket No. RM16-1-000, Page 37\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators must maintain a dynamic reactive power capability between 0.95 leading and 0.95 lagging at the high-side of the substation to ensure grid stability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_150", "label": "R_150\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_150\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e p_mw \u003c 0.1 * nameplate_capacity\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Commission proposal, Id. P 16\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Inverters used by non-synchronous generators cannot produce reactive power when operating below 10% of nameplate capacity."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_151", "label": "R_151\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_151\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e real_power_output_pct \u003e 10\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e SGIA, Order No. 661, FERC Stats. \u0026 Regs. \u00b6 31,186 at P 46\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Non-synchronous generators must maintain power factor when output exceeds 10% of nameplate capacity to ensure grid stability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_152", "label": "R_152\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_152\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e signal_resolution_hz == 100\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.6.6.2.1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage control tests require a signal resolution of 100 Hz to ensure accurate monitoring."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_153", "label": "R_153\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_153\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_v \u003e= -10 AND voltage_v \u003c= 10\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.6.6.2.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Test signals must be within the -10V to +10V range to ensure compatibility with monitoring equipment."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_155", "label": "R_155\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_155\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e power_factor \u003c 0.95 OR power_factor \u003e 0.95\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e pro forma SGIA, Section 1.8.1.1; pro forma SGIA, Section 1.8.1.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Synchronous generators must maintain power factor within 0.95 leading to 0.95 lagging at the point of interconnection to ensure grid stability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_156", "label": "R_156\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_156\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e system_frequency \u003e target_frequency AND operating_level \u003c minimum_generation\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e RESPOND_WITHIN_2S\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.A.3.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e If operating below Minimum Generation due to high System Frequency, the unit must recover to Minimum Generation as frequency returns to Target."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_158", "label": "R_158\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_158\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e load_rejection_level \u003c DesignedMinimumOperatingLevel\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e DISCONNECT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Load rejection below designed minimum operating level may necessitate disconnection due to severe operational conditions."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_159", "label": "R_159\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_159\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_response_pct \u003c minimum_required_response_pct\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Appendix X\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generating units must provide frequency response at least equal to the minimum requirement defined by the solid boundaries in the figure."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_160", "label": "R_160\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_160\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e percentage_of_applicable_units \u003e 20\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Requirement R3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generator owners must develop corrective action plans when more than 20% of applicable units are affected."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_162", "label": "R_162\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_162\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e parts_included \u003c (required_parts - 2)\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Requirement R4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generator owners must address missing three or more required parts in cold weather preparedness plans to avoid operational risks."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_163", "label": "R_163\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_163\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e active_power_output \u003c= minimum_generation_level\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Adjusting output to maintain frequency stability when operating at minimum levels."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_164", "label": "R_164\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_164\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Line\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e vegetation_encroachment_within_MVCD = true\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided, Section 5\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Confirmed vegetation encroachment within the MVCD is treated as a fault requiring attention."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_165", "label": "R_165\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_165\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e time_since_frequency_disturbance_minutes \u003e 20\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Issue 5 Revision 21 CC 21 March 2017\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e After a significant frequency disturbance, generating units must fully restore their response capability within 20 minutes to maintain grid stability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_171", "label": "R_171\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_171\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_error_hz \u003e 0.01\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.A.5.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Ensuring relay accuracy under reference environmental and system voltage conditions."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_172", "label": "R_172\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_172\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_error_hz \u003e 0.05 OR harmonic_distortion_pct \u003e 8\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.A.5.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Limiting relay frequency error under harmonic distortion conditions."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_177", "label": "R_177\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_177\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e terminal_voltage_drop_percent \u003c= 0.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.A.6.2.3.1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Steady-state voltage control must limit terminal voltage drop to \u22640.5% during load changes."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_179", "label": "R_179\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_179\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e time_to_reach_100_percent \u003c 0.6 AND time_to_settle_within_5_percent \u003c 3\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.A.6.2.4.1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Ensuring the generator\u0027s voltage response to step changes meets specified transient time limits for stability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_181", "label": "R_181\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_181\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e verification_months \u003e 13 AND verification_months \u003c= 14\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Attachment 1, \"Periodicity for conducting a new verification\" item 1, 2 or 3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Verification not conducted within required 12-month interval, but performed within 13-14 months."}, {"color": "#9b9b9b", "font": {"color": "#e0e0e0"}, "id": "R_182", "label": "R_182\n(low)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_182\u003c/b\u003e [LOW]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e verification_months \u003e 14 AND verification_months \u003c= 15\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Attachment 1, \"Periodicity for conducting a new verification\" item 1, 2 or 3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Verification not conducted within required 12-month interval, but performed within 14-15 months."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_183", "label": "R_183\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_183\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e NGET identifies a Transmission System need\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Bilateral Agreement\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e A separate power source for the exciter must be specified if NGET identifies a transmission system need."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_186", "label": "R_186\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_186\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e time_since_verification_months \u003e 12 AND time_since_verification_months \u003c= 13\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Attachment 1, Periodicity (12 calendar month for conducting a new requirement)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generator Owner must perform reactive power verification within 12-15 calendar months to ensure compliance with periodicity requirements."}, {"c
