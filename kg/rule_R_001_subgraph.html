ure accurate voltage modeling."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_006", "label": "R_006\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_006\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e re_dispatch_required AND facilities_within_ratings AND NOT non_consequential_load_loss\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text, Point 9\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Curtailment of Firm Transmission Service is allowed through re-dispatch if facilities remain within ratings and no non-consequential load loss occurs."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_008", "label": "R_008\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_008\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e relay_count == 1 AND alternative_relay_available == false\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Page 29 of 32\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e A single protective relay without an alternative may fail to clear faults within required times, risking equipment damage or safety hazards."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_013", "label": "R_013\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_013\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e non_consequential_load_loss_mw \u003e= 25\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e TPL-001-5.1 \u2014 Transmission System Planning Performance Requirements\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Non-Consequential Load Loss is allowed if the planned loss is at least 25 MW."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_035", "label": "R_035\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_035\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e mho_relay_criteria_met == false\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Alternative relay methods (e.g., blenders, lenticular relays) may be required if mho relay cannot meet Table 1 criteria."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_036", "label": "R_036\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_036\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e power_factor_tolerance NOT DEFINED BY RELEVANT NETWORK OPERATOR\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e ENTSO-E, Article 15(2)(a), Article 16(3)(a) and (b)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Power factor target values and tolerances must be explicitly defined by the relevant network operator according to Article 4(3)."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_042", "label": "R_042\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_042\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e undamped_oscillations == true\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Article 10(2)(b)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Undamped oscillations after step change response are unsafe and must be prevented."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_048", "label": "R_048\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_048\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e overcurrent_setting_percent \u003e 115 AND real_power_output_pct == 100 AND reactive_power_output_pct == 100\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Overcurrent protection settings must be set above 115% of calculated current derived from 100% real power and 100% reactive power outputs for Option 8c."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_051", "label": "R_051\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_051\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e overcurrent_current_pu \u003e 1.15 * (real_power_pu * 1.0 + reactive_power_pu * 1.0)\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text, Overcurrent Element Setting (Option 9c)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Overcurrent elements must be set above 115% of calculated current derived from real and reactive power thresholds (100% of maximum gross Mvar) to prevent false tripping."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_052", "label": "R_052\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_052\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e undamped_oscillations == false\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e ENTSO-E AISBL, Article 10(2)(c)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Undamped oscillations after a step change response are not allowed as they can destabilize the grid."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_053", "label": "R_053\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_053\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e initial_delay \u003c= required_delay\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e ENTSO-E AISBL, Article 10(2)(c)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The initial delay must comply with the requirements in Article 10(2)(c) to ensure timely frequency response."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_055", "label": "R_055\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_055\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu == 1.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 Application Guidelines\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Transformer bus voltage must correspond to 1.0 per unit nominal voltage on the high-side winding to accommodate protection philosophy and prevent overcurrent relays from operating during dynamic conditions."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_056", "label": "R_056\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_056\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_bias_setting \u003c 0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The Frequency Bias Setting must be less than zero at all times to ensure proper regulation."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_065", "label": "R_065\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_065\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e reactive_power_mvar \u003e 1.0 * aggregate_generation_mw\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 Application Guidelines, Page 53\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Reactive power output must not exceed 100% of aggregate generation MW for Option 15b to ensure proper overcurrent element settings."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_075", "label": "R_075\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_075\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e net_real_power_mw \u003e 1500\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e NERC standard BAL-002, Contingency Reserve requirements\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Ensures the Balancing Authority can utilize Contingency Reserve to balance resources and return Interconnection frequency within defined limits following a Reportable Disturbance."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_076", "label": "R_076\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_076\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e 51.0 AND frequency_hz \u003c= 51.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.6.1.3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Plant must operate for at least 90 minutes when frequency is between 51.0-51.5Hz."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_077", "label": "R_077\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_077\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e torque_angle \u003e 85\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 Application Guidelines, Example Calculations: Options 1b and 7b\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Exceeding maximum torque angle (MTA) of 85\u00b0 may compromise generator stability and synchronization."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_078", "label": "R_078\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_078\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e reactive_power_mvar \u003e= 1000\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Attachment 1, Criterion 2.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Facilities providing reactive resources must have a nameplate reactive power capability of at least 1000 MVARs to be considered critical for BES reliability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_079", "label": "R_079\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_079\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e= 47.0 AND frequency_hz \u003c 47.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.6.1.3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Plant must operate for at least 20 seconds when frequency is between 47.0-47.5Hz."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_086", "label": "R_086\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_086\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e p_mw \u003e 700.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 Application Guidelines\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Exceeding the rated real power capacity (700.0 MW) could damage generator equipment."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_087", "label": "R_087\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_087\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Line\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e loading_mva \u003e 3000\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e NERC\u2019s document \u2013 Refinement to Severity Risk Index\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e 765 kV line loading exceeding 3,000 MVA triggers an alert based on average MVA loading criteria."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_089", "label": "R_089\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_089\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 0.90 within 80ms OR voltage_pu \u003c 0.97 within 2s\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.6.1.7\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage drops exceeding 10% within 80ms or 3% within 2s violate rapid voltage change limits for grid stability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_090", "label": "R_090\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_090\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e flicker_severity_short_term \u003e 0.8 OR flicker_severity_long_term \u003e 0.6 (for \u003e132kV) OR flicker_severity_short_term \u003e 1.0 OR flicker_severity_long_term \u003e 0.8 (for \u003c=132kV)\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Engineering Recommendation P28\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Flicker severity thresholds must be adhered to prevent perceptible light flicker in electrical systems."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_094", "label": "R_094\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_094\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e 1.4\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e During single or two-phase-to-earth faults, phase-to-earth voltage may transiently rise to 140% in England and Wales."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_095", "label": "R_095\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_095\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e load_shed_mw \u003e= 300\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e SHED_LOAD\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Section 4.1.2.1.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Automatic load shedding of 300 MW or more is required to prevent overloads without human intervention."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_096", "label": "R_096\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_096\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e shed_load_mw \u003e= 300\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e SHED_LOAD\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e NERC Reliability Standard, Section 4.2.1.1.2; NERC or Regional Reliability Standard, Section 4.1.2.1.2; NERC Reliability Standards, Section 4.1.2.1.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Automatic load shedding of 300 MW or more is required to maintain system stability during underfrequency or undervoltage events without human intervention."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_099", "label": "R_099\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_099\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e p_mw \u003e 300\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e standards for UFLS program requirements\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e 300 MW is the historical threshold for allowable UFLS operational tolerances"}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_105", "label": "R_105\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_105\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e probability_exceedance_pct \u003e= 2.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Bilateral Agreement\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The probability of exceeding the agreed fault clearance time must be less than 2%."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_108", "label": "R_108\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_108\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_level_kV IN (400, 275) AND loading_during_fault_clearance \u003e 0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Issue 5 Revision 21 CC 21 March 2017, Page 149\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Protection systems must withstand loading during fault clearance on 400kV/275kV transmission systems without tripping to maintain discrimination with backup protections."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_128", "label": "R_128\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_128\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e load_shed_mw \u003e= 100\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e SHED_LOAD\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e EOP-004-4 \u2013 Event Reporting\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Firm load shedding of 100 MW or more during a BES Emergency triggers automatic or manual load reduction."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_130", "label": "R_130\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_130\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e measurement_cycles \u003c 3 OR measurement_cycles \u003e 6\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-029-1 \u2013 Frequency and Voltage Ride-through Requirements for Inverter-based Resources, Attachment 2: Frequency Ride-Through Criteria, Note 2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Frequency measurements must be taken over 3\u20136 cycles at the high-side of the main transformer."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_131", "label": "R_131\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_131\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e filtering_length_ms \u003c 16.6\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-029-1 \u2013 Frequency and Voltage Ride-through Requirements for Inverter-based Resources, Attachment 2: Frequency Ride-Through Criteria, Note 1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Instantaneous trip settings with filtering lengths less than 16.6 ms are not permissible."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_135", "label": "R_135\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_135\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e number_of_bes_facilities_lost \u003e= 3 AND cause == \u0027common_disturbance\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e EOP-004-4 \u2013 Event Reporting, Page 514\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Unexpected loss of three or more BES facilities due to a common disturbance requires alerting."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_137", "label": "R_137\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_137\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e interpersonal_communication_available == false AND alternative_communication_available == false\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e EOP-004-4 \u2013 Event Reporting, Page 514\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Complete loss of both interpersonal and alternative communication systems requires immediate alerting."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_150", "label": "R_150\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_150\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e p_mw \u003c 0.1 * nameplate_capacity\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Commission proposal, Id. P 16\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Inverters used by non-synchronous generators cannot produce reactive power when operating below 10% of nameplate capacity."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_151", "label": "R_151\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_151\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e real_power_output_pct \u003e 10\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e SGIA, Order No. 661, FERC Stats. \u0026 Regs. \u00b6 31,186 at P 46\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Non-synchronous generators must maintain power factor when output exceeds 10% of nameplate capacity to ensure grid stability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_152", "label": "R_152\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_152\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e signal_resolution_hz == 100\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.6.6.2.1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage control tests require a signal resolution of 100 Hz to ensure accurate monitoring."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_153", "label": "R_153\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_153\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_v \u003e= -10 AND voltage_v \u003c= 10\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.6.6.2.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Test signals must be within the -10V to +10V range to ensure compatibility with monitoring equipment."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_171", "label": "R_171\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_171\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_error_hz \u003e 0.01\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.A.5.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Ensuring relay accuracy under reference environmental and system voltage conditions."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_172", "label": "R_172\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_172\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_error_hz \u003e 0.05 OR harmonic_distortion_pct \u003e 8\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e CC.A.5.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Limiting relay frequency error under harmonic distortion conditions."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_196", "label": "R_196\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_196\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e measurement_side == \u0027high_side\u0027 AND transformer_type == \u0027GSU\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Section 2.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Calculate GSU transformer losses when measurements are taken from the high side of the transformer."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_202", "label": "R_202\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_202\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_deviation_hz \u003e= 0.30\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text, Section 3.3.2.3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Frequency deviation during a frequency excursion event must reach at least 0.30 Hz in the Quebec Interconnection to validate frequency control models."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_204", "label": "R_204\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_204\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_deviation_hz \u003e 0.30\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 3.3.2.3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Excessive frequency deviation in the Quebec Interconnection may destabilize the grid."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_221", "label": "R_221\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_221\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e fault_level_mva = min_fault_level\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Fault level at Supergrid HV connection point must use minimum network operator impedance for embedded systems."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_227", "label": "R_227\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_227\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e nameplate_rating_mva \u003e= 300 AND plant_aggregate_rating_mva \u003e= 1000\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e R5.1.1.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Synchronous generators with \u2265300 MVA individual ratings in plants with \u22651,000 MVA aggregate ratings require DDR data for stability analysis."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_236", "label": "R_236\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_236\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e percentage_monitored_buses \u003e= 80 AND percentage_monitored_buses \u003c 90\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-002-5 \u2013 Disturbance Monitoring and Reporting Requirements, Table on Violation Severity Levels\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Monitoring coverage for BES buses falls between 80% and 90% of required coverage."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_237", "label": "R_237\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_237\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e percentage_monitored_buses \u003e= 70 AND percentage_monitored_buses \u003c 80\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-002-5 \u2013 Disturbance Monitoring and Reporting Requirements, Table on Violation Severity Levels\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Monitoring coverage for BES buses falls between 70% and 80% of required coverage."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_238", "label": "R_238\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_238\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e percentage_monitored_buses \u003c 70\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-002-5 \u2013 Disturbance Monitoring and Reporting Requirements, Table on Violation Severity Levels\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Monitoring coverage for BES buses falls below 70% of required coverage."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_239", "label": "R_239\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_239\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e power_park_units_in_service_pct \u003e= 95\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e OC5.A.3.4.1; OC5.A.3.6.1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Tests should be scheduled when at least 95% of Power Park Units are in service."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_240", "label": "R_240\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_240\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e alarm_reporting_delay_hours \u003e 24\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-005-6 \u2013 Protection System, Automatic Reclosing, and Sudden Pressure Relaying Maintenance, Table 2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Alarm signals must be reported within 24 hours to ensure timely corrective action can be initiated at the appropriate location."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_246", "label": "R_246\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_246\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e nameplate_rating_mva \u003e 75\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-006-5 \u2014 Automatic Underfrequency Load Shedding\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generating plants/facilities with a gross aggregate nameplate rating exceeding 75 MVA must not have underfrequency trip settings that exceed the Generator Underfrequency Trip Modeling curve."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_248", "label": "R_248\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_248\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e test_duration_seconds \u003e= 10\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e OC5.A.3.5.4; OC5.A.3.5.6(ii)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage control system step injection must be maintained for at least 10 seconds during testing."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_249", "label": "R_249\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_249\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e tap_change_time_seconds \u003e= 10\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e OC5.A.3.5.6(i)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Transformer tap changes must be spaced at least 10 seconds apart during voltage control tests."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_252", "label": "R_252\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_252\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e mw_resource_pct \u003e= 65\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e OC5.A.3.6.1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Tests require sufficient MW resource (65% of Registered Capacity) to maintain system stability during testing."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_253", "label": "R_253\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_253\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_controller_mode IN (\"Frequency Sensitive Mode\", \"Limited Frequency Sensitive Mode\")\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e OC5.A.3.6.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Frequency controller must operate in specified modes during tests to ensure accurate frequency response evaluation."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_254", "label": "R_254\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_254\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e injected_signal_replaces_real_frequency\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e OC5.A.3.6.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Additional tests are required if injected frequency signals replace real system signals to validate normal mode performance."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_256", "label": "R_256\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_256\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e generation_deficiency_pct \u003e 25\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e SHED_LOAD\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-006-5 \u2014 Automatic Underfrequency Load Shedding, D.A.3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The Quebec Interconnection must maintain network stability for extreme contingencies with up to 25% generation deficiency, as no viable BES Island exists for underfrequency conditions."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_270", "label": "R_270\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_270\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e p_mw_change \u003e 0.1 * registered_capacity\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e OC5.A.4.3.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Limits active power ramp rate to 10% of registered capacity to prevent instability during reactive transfer tests."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_273", "label": "R_273\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_273\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e sampling_rate_hz \u003c 1\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e OC5.A.4.5.5\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Data must be sampled at a minimum rate of 1 Hz to allow assessment of plant performance from transients to steady-state conditions."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_277", "label": "R_277\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_277\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e loading_pct \u003e= 120\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e OC5.A.4.5.7\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Module Load Point 3 must not fall below DMOL + 20% to maintain operational stability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_278", "label": "R_278\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_278\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003c (0.575*log(time_s) + 57.63) AND 2 \u003c time_s \u003c= 60\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e SHED_LOAD\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-006-5 \u2014 Automatic Underfrequency Load Shedding\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Load must be shed when frequency falls below the logarithmic threshold (0.575*log(t) + 57.63) between 2 and 60 seconds to maintain grid stability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_279", "label": "R_279\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_279\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003c 59.3 AND time_s \u003e 60\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e SHED_LOAD\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-006-5 \u2014 Automatic Underfrequency Load Shedding\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Load must be shed when frequency drops below 59.3 Hz after 60 seconds to address prolonged underfrequency conditions."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_287", "label": "R_287\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_287\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e demand_subject_to_low_freq_disconnect = true\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e OC6.6.2(a)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Splits demand into discrete MW blocks to manage automatic low frequency disconnection events."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_293", "label": "R_293\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_293\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e system_margin \u003c required_threshold\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Licence Standards, System Margin (d)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Insufficient system margin may lead to instability in the National Electricity Transmission System."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_296", "label": "R_296\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_296\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e system_nr_apm \u003c required_margin OR localised_nr_apm \u003c required_margin\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e NGET Operational Guidelines\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e NGET may adjust System or Localised NRAPM margins based on forecast demand variations and dynamic parameters."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_299", "label": "R_299\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_299\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003c underfrequency_trip_setpoint_hz\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e SHED_LOAD\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Requirement 2.1 of this Standard\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Compensatory load shedding is required when the generator trips above the underfrequency curve to maintain grid stability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_307", "label": "R_307\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_307\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e time_since_de_synchronization \u003c 15 minutes AND synchronization_intended\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BC2.5.2.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e A minimum 5-minute notice must be provided to NGET for synchronization attempts within 15 minutes of unplanned de-synchronization."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_308", "label": "R_308\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_308\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e de_synchronization_occurred AND synchronization_intended AND time_before_period_expiry \u003e 0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BC2.5.2.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e A minimum notice period is required for synchronization attempts before the Balancing Mechanism period expires following unplanned de-synchronization."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_316", "label": "R_316\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_316\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e tap_changer_mode != \u0027manual\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BC2.11.2(b); Issue 5 Revision 19 BC2, Page 502\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Preventing unintended changes to transformer taps by requiring manual mode unless released by NGET."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_323", "label": "R_323\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_323\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e p_mw \u003e 100\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e SHED_LOAD\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e SERC UFLS Standard: PRC-006-SERC-3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The 100 MW threshold ensures adequate flexibility for implementing load shedding in three steps for entities slightly greater than 100 MW."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_334", "label": "R_334\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_334\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e RAS_functional_modification_detected\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Supplemental Material, Page 1184\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The source text states the required RAS changes would be a functional modification, not that it is required; the explanation should reflect that it is a functional modification requiring review."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_354", "label": "R_354\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_354\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Line\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e loading_duration_in_FacilityRating != 4_hours\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Planning Coordinator\u0027s power flow analysis, Section d\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The threshold for circuit loading depends on the loading duration assumed in the Facility Rating, requiring dynamic adjustment."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_369", "label": "R_369\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_369\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e transformer_type == \u0027GSU\u0027 AND tap_changer_type == \u0027DETC\u0027 AND tap_in_service == true\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 \u2013 Generator Relay Loadability, Page 1269\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Using the actual tap setting for GSU transformers with de-energized tap changers ensures accurate impedance calculations."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_371", "label": "R_371\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_371\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e topology_type == \u0027multiple_winding_transformer\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 \u2013 Generator Relay Loadability, Page 1269\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Complex topologies like generators connected to multiple winding transformers require simulation to avoid overly conservative relay settings."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_376", "label": "R_376\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_376\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 0.9\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage below 0.9 p.u. requires no disconnection to maintain grid integrity during fault conditions."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_384", "label": "R_384\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_384\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e impedance_pu \u003c calculated_impedance\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 \u2013 Generator Relay Loadability, Table 1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Impedance relay settings must be less than calculated impedance to ensure proper fault detection."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_396", "label": "R_396\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_396\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e 0.85\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage at relay location must not drop below 0.85 per unit of line nominal to maintain equipment integrity."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_402", "label": "R_402\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_402\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003c 49.25\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e DISCONNECT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 8.3.3.9\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Disconnect feeders to stabilize system frequency when it falls below 49.25 Hz."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_410", "label": "R_410\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_410\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_setting_pu \u003c 0.75 * calculated_generator_bus_voltage_pu\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Protection Coordination technical reference document, Option 3; Option 6\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The voltage control setting must be set below 75% of the calculated generator bus voltage to prevent relay tripping during extreme emergency conditions."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_416", "label": "R_416\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_416\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e impedance_element \u003c calculated_impedance(115% * real_power(100% * aggregate_generation_mw), 100% * reactive_power(max_gross_mvar_during_field_forcing))\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Impedance settings for Option 7c must use 100% of maximum reactive power during field-forcing as determined by simulation to ensure accurate protection."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_426", "label": "R_426\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_426\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e loading_pct \u003e 95%\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 Application Guidelines\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Transformers operating near full load may require monitoring to prevent overheating or failure."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_428", "label": "R_428\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u
