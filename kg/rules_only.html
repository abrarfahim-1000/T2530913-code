3e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e tap_changer_mode != \u0027manual\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BC2.11.2(b); Issue 5 Revision 19 BC2, Page 502\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Preventing unintended changes to transformer taps by requiring manual mode unless released by NGET."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_318", "label": "R_318\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_318\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e completion_date \u003c \u00272006-01-01\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Issue 5 Revision 19 BC2, Page 502\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators with Power Park Modules completed before 2006 must operate at unity power factor."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_319", "label": "R_319\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_319\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e completion_date \u003e= \u00272006-01-01\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Issue 5 Revision 19 BC2, Page 502\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators with Power Park Modules completed on or after 2006 must operate in voltage control mode."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_323", "label": "R_323\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_323\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e p_mw \u003e 100\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e SHED_LOAD\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e SERC UFLS Standard: PRC-006-SERC-3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The 100 MW threshold ensures adequate flexibility for implementing load shedding in three steps for entities slightly greater than 100 MW."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_327", "label": "R_327\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_327\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e time_since_instruction \u003e= 7\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Document: Unit, DC SETPOINT\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generator cannot implement new slope settings within 1 week of instruction to allow proper coordination with NGET."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_332", "label": "R_332\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_332\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e high_frequency_response_required == true AND in_frequency_sensitive_mode == true\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e RESPOND_WITHIN_2S\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Synchronised gensets must provide high frequency response within 2 seconds to maintain system stability during active power transfers."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_334", "label": "R_334\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_334\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e RAS_functional_modification_detected\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Supplemental Material, Page 1184\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The source text states the required RAS changes would be a functional modification, not that it is required; the explanation should reflect that it is a functional modification requiring review."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_335", "label": "R_335\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_335\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e time_s \u003c= 10\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Ancillary Services Agreement\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Active power reduction must be completed within 10 seconds to maintain system stability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_337", "label": "R_337\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_337\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e active_power_reduction_pct \u003e= designed_min_operating_level_pct\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Frequency Response Requirements\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Active power reduction cannot be below the designed minimum operating level."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_338", "label": "R_338\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_338\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e reduction_rate_pct_per_0_1_hz \u003e= 2\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Frequency Response Requirements\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Active power must reduce at a minimum rate of 2% per 0.1 Hz frequency deviation above 50.5 Hz."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_339", "label": "R_339\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_339\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Bus\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e post_contingency_upper_limit OR voltage_pu \u003c post_contingency_lower_limit\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e NERC Reliability Standard PRC-012, R1.5 and PRC-014, R3.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e BES voltages must remain within post-contingency voltage limits established by planners to maintain stability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_340", "label": "R_340\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_340\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Bus\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e transient_voltage_deviation \u003e acceptable_transient_limit\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e NERC Reliability Standard PRC-012, R1.5 and PRC-014, R3.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Transient voltage responses must stay within acceptable limits to prevent equipment damage and instability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_341", "label": "R_341\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_341\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e generation_output_pct \u003c minimum_generation_pct\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BC3.7.3(a)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e If operating below Minimum Generation, NGET must not unreasonably withhold Bid-Offer Acceptance to return to Minimum Generation."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_343", "label": "R_343\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_343\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e mva_rating \u003e 20\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018, Section 4.2.1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generating units greater than 20 MVA directly connected to the Bulk Electric System must comply with voltage regulating control requirements."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_354", "label": "R_354\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_354\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Line\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e loading_duration_in_FacilityRating != 4_hours\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Planning Coordinator\u0027s power flow analysis, Section d\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The threshold for circuit loading depends on the loading duration assumed in the Facility Rating, requiring dynamic adjustment."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_359", "label": "R_359\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_359\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e power_factor NOT within PPA limits OR NOT within Reactive Power Capability Curve\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Section 5.8.3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators must supply full active power within specified power factor limits defined in the PPA and their capability curve."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_360", "label": "R_360\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_360\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e automatic_excitation_control_system NOT present\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Section 5.8.3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators must be equipped with continuously acting automatic excitation control systems to maintain terminal voltage stability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_362", "label": "R_362\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_362\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e black_start_capable = false\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 5.8.5 Black Start Capability\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Lack of Black Start capability prevents system recovery after outages."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_364", "label": "R_364\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_364\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003c 47.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Frequency Response\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e VRE Generating Units must remain connected for at least 5 seconds if frequency momentarily drops below 47.5 Hz to avoid unnecessary disconnections."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_365", "label": "R_365\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_365\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e 52.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Frequency Response\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e VRE Generating Units may disconnect from the grid if frequency exceeds 52.0 Hz to prevent equipment damage during over-frequency events."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_369", "label": "R_369\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_369\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e transformer_type == \u0027GSU\u0027 AND tap_changer_type == \u0027DETC\u0027 AND tap_in_service == true\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 \u2013 Generator Relay Loadability, Page 1269\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Using the actual tap setting for GSU transformers with de-energized tap changers ensures accurate impedance calculations."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_370", "label": "R_370\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_370\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e= 0.9\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The VRE Generating Plant must remain connected indefinitely during three-phase faults up to fault clearance when voltage is equal to or above 90% of nominal."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_371", "label": "R_371\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_371\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e topology_type == \u0027multiple_winding_transformer\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 \u2013 Generator Relay Loadability, Page 1269\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Complex topologies like generators connected to multiple winding transformers require simulation to avoid overly conservative relay settings."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_373", "label": "R_373\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_373\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e fault_exists OR voltage_recovery_period\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The source text restricts reactive power consumption to the first 150 milliseconds after fault initiation and during voltage recovery, not exclusively during those periods."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_374", "label": "R_374\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_374\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e (fault_initiation_time \u003c 150ms OR fault_clearing_time \u003c 150ms) AND reactive_power_consumption_pu \u003c= 0.6\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Reactive power consumption by VRE Generating Plant is limited to 60% of nominal capacity during specific fault periods to prevent instability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_375", "label": "R_375\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_375\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e (fault_exists OR voltage_recovery_period) AND active_power_consumption_pu \u003e 0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Active power consumption by VRE Generating Plant is prohibited during fault and recovery periods to avoid grid instability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_376", "label": "R_376\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_376\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 0.9\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage below 0.9 p.u. requires no disconnection to maintain grid integrity during fault conditions."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_377", "label": "R_377\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_377\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e (fault_period OR recovery_period) AND current_injection_pu \u003c max_possible\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e VRE Generating Plant must inject maximum possible current during fault and recovery periods to support grid stability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_384", "label": "R_384\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_384\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e impedance_pu \u003c calculated_impedance\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 \u2013 Generator Relay Loadability, Table 1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Impedance relay settings must be less than calculated impedance to ensure proper fault detection."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_385", "label": "R_385\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_385\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Bus\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 0.85\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 \u2013 Generator Relay Loadability, Table 1; PRC-025-2 Application Guidelines, Example Calculations: Options 15a and 16a; PRC-025-2 Application Guidelines, Example Calculations: Option 14a\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generator bus voltage must not drop below 0.85 per unit to maintain stable system operation."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_389", "label": "R_389\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_389\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_deviation \u003e 0.05Hz OR frequency_deviation \u003c -0.05Hz\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e RESPOND_WITHIN_2S\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Governor. (e)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Governors must respond to frequency deviations exceeding the dead band to maintain stability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_390", "label": "R_390\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_390\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e islanded_mode = true AND frequency_outside_specified_range\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Governor. (g)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Governor control systems must maintain frequency within acceptable limits during islanded operation."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_393", "label": "R_393\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_393\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e (droop_pct \u003c 4 OR droop_pct \u003e 6) AND thermal_unit OR (droop_pct \u003c 2 OR droop_pct \u003e 3) AND hydro_unit\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Section 8.3.2.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Governors in FGMO mode must have droop settings within 4-6% for thermal units and 2-3% for hydro units to ensure proper frequency response."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_394", "label": "R_394\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_394\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e droop_pct BETWEEN 4 AND 6 FOR THERMAL UNITS OR BETWEEN 2 AND 3 FOR HYDRO UNITS\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 8.3.2.1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Maintains stable frequency regulation through appropriate droop settings for different generator types."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_396", "label": "R_396\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_396\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e 0.85\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage at relay location must not drop below 0.85 per unit of line nominal to maintain equipment integrity."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_397", "label": "R_397\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_397\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e 50.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 8.3.2.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Triggers immediate action to reduce frequency when it exceeds 50.5Hz to prevent system instability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_401", "label": "R_401\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_401\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e (droop_pct \u003c 4.0 OR droop_pct \u003e 6.0) AND unit_type == \u0027thermal\u0027 OR (droop_pct \u003c 2.0 OR droop_pct \u003e 3.0) AND unit_type == \u0027hydro\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 8.3.3.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Governor systems must operate with droop within 2-3% for hydro units and 4-6% for thermal units in FGMO."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_402", "label": "R_402\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_402\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003c 49.25\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e DISCONNECT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 8.3.3.9\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Disconnect feeders to stabilize system frequency when it falls below 49.25 Hz."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_410", "label": "R_410\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_410\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_setting_pu \u003c 0.75 * calculated_generator_bus_voltage_pu\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Protection Coordination technical reference document, Option 3; Option 6\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The voltage control setting must be set below 75% of the calculated generator bus voltage to prevent relay tripping during extreme emergency conditions."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_414", "label": "R_414\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_414\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e governor_parameters_out_of_limits\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Page 84, Section 14.5.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Ensuring governor parameters are within acceptable limits to maintain proper frequency response."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_416", "label": "R_416\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_416\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e impedance_element \u003c calculated_impedance(115% * real_power(100% * aggregate_generation_mw), 100% * reactive_power(max_gross_mvar_during_field_forcing))\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Impedance settings for Option 7c must use 100% of maximum reactive power during field-forcing as determined by simulation to ensure accurate protection."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_417", "label": "R_417\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_417\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e active_power_response_pct \u003e= -5 AND active_power_response_pct \u003c= 5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e VRE Generating Plant Test Requirements, Section 14.6.2(b)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e To ensure the VRE Generating Plant meets active power control response requirements within specified timeframes."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_418", "label": "R_418\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_418\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e power_output_pu \u003e 1.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e FERC Order No. 733, paragraph 104\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generator power output must not exceed 150% of the aggregate generation MW value derived from the generator nameplate MVA rating."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_426", "label": "R_426\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_426\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e loading_pct \u003e 95%\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e PRC-025-2 Application Guidelines\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Transformers operating near full load may require monitoring to prevent overheating or failure."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_428", "label": "R_428\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_428\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_imbalance_pct \u003e 2.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text, voltage imbalance paragraph\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage imbalance exceeding 2% is not permitted unless under specific Connection Agreement terms."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_433", "label": "R_433\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_433\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 0.70\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e DISCONNECT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Clause 6.4.1 and Table 2.2 in IEEE Std 1547-2018\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Undervoltage below 0.70 pu necessitates tripping within 2.0 seconds to avoid system instability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_437", "label": "R_437\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_437\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e relay_setting_pu \u003e 1.3 * calculated_current_pu\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Power Plant and Transmission System Protection Coordination technical reference document, Table 1, Option 18\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Phase overcurrent relays must be set above 130% of the calculated current derived from the maximum aggregate nameplate MVA output to prevent unintended tripping during dynamic conditions."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_438", "label": "R_438\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_438\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c= 0.88\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018, Table 2.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage below this threshold for UV1 requires coordination with clearing time settings."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_439", "label": "R_439\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_439\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c= 0.50\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018, Table 2.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage below this threshold for UV2 requires coordination with clearing time settings."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_444", "label": "R_444\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_444\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\
