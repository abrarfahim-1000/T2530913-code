\u003c/b\u003e Load\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e demand_subject_to_low_freq_disconnect = true\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e OC6.6.2(a)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Splits demand into discrete MW blocks to manage automatic low frequency disconnection events."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_293", "label": "R_293\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_293\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e system_margin \u003c required_threshold\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Licence Standards, System Margin (d)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Insufficient system margin may lead to instability in the National Electricity Transmission System."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_296", "label": "R_296\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_296\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e system_nr_apm \u003c required_margin OR localised_nr_apm \u003c required_margin\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e NGET Operational Guidelines\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e NGET may adjust System or Localised NRAPM margins based on forecast demand variations and dynamic parameters."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_298", "label": "R_298\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_298\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e (power_factor \u003c 0.85 OR power_factor \u003e 0.95) AND active_power_mw \u003e rated_mw\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BC1.8.1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Operating outside specified power factor ranges at active power levels above rated capacity risks voltage instability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_299", "label": "R_299\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_299\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e completion_date \u003e= \u00272009-05-01\u0027 OR connection_entry_capacity_mw \u003e rated_mw\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BC1.8.1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators with post-2009 completion dates or increased capacity require additional reactive power support measures."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_307", "label": "R_307\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_307\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e time_since_de_synchronization \u003c 15 minutes AND synchronization_intended\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BC2.5.2.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e A minimum 5-minute notice must be provided to NGET for synchronization attempts within 15 minutes of unplanned de-synchronization."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_308", "label": "R_308\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_308\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e de_synchronization_occurred AND synchronization_intended AND time_before_period_expiry \u003e 0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BC2.5.2.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e A minimum notice period is required for synchronization attempts before the Balancing Mechanism period expires following unplanned de-synchronization."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_316", "label": "R_316\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_316\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e tap_changer_mode != \u0027manual\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BC2.11.2(b); Issue 5 Revision 19 BC2, Page 502\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Preventing unintended changes to transformer taps by requiring manual mode unless released by NGET."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_318", "label": "R_318\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_318\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e completion_date \u003c \u00272006-01-01\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Issue 5 Revision 19 BC2, Page 502\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators with Power Park Modules completed before 2006 must operate at unity power factor."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_319", "label": "R_319\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_319\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e completion_date \u003e= \u00272006-01-01\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Issue 5 Revision 19 BC2, Page 502\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators with Power Park Modules completed on or after 2006 must operate in voltage control mode."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_323", "label": "R_323\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_323\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e= 1.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Name Instruction, MVAr Output\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generator terminal voltage must not fall below 1.0 p.u. to prevent equipment damage and maintain system reliability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_327", "label": "R_327\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_327\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e time_since_instruction \u003e= 7\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Document: Unit, DC SETPOINT\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generator cannot implement new slope settings within 1 week of instruction to allow proper coordination with NGET."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_332", "label": "R_332\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_332\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e high_frequency_response_required == true AND in_frequency_sensitive_mode == true\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e RESPOND_WITHIN_2S\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Synchronised gensets must provide high frequency response within 2 seconds to maintain system stability during active power transfers."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_334", "label": "R_334\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_334\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e 50.00 \u003c system_frequency_hz \u003c= 50.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Ancillary Services Agreement\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The rate of active power reduction must adhere to the Ancillary Services Agreement\u0027s specifications."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_335", "label": "R_335\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_335\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e time_s \u003c= 10\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Ancillary Services Agreement\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Active power reduction must be completed within 10 seconds to maintain system stability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_337", "label": "R_337\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_337\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e active_power_reduction_pct \u003e= designed_min_operating_level_pct\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Frequency Response Requirements\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Active power reduction cannot be below the designed minimum operating level."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_338", "label": "R_338\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_338\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e reduction_rate_pct_per_0_1_hz \u003e= 2\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Frequency Response Requirements\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Active power must reduce at a minimum rate of 2% per 0.1 Hz frequency deviation above 50.5 Hz."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_339", "label": "R_339\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_339\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e active_power_reduction_pct == proportional_to_frequency_excess\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Frequency Response Requirements\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Active power reduction must be continuously proportional to the frequency excess above 50.5 Hz."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_340", "label": "R_340\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_340\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e 50.4\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BC3.7.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Gensets must continue providing Limited High Frequency Response until frequency returns to or below 50.4 Hz."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_341", "label": "R_341\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_341\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e generation_output_pct \u003c minimum_generation_pct\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e BC3.7.3(a)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e If operating below Minimum Generation, NGET must not unreasonably withhold Bid-Offer Acceptance to return to Minimum Generation."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_343", "label": "R_343\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_343\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e output_mw \u003c designed_min_output_mw\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Issue 5 Revision 0 BC3 17 August 2012\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Tripping may occur if output reduction exceeds designed minimum operating levels, requiring protective actions."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_354", "label": "R_354\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_354\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e= 0.95 AND voltage_pu \u003c= 1.05\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Note 1, Schedule 15, Page 599\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Pre-fault voltage must be within 0.95\u20131.05 p.u. to ensure accurate fault current calculations"}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_359", "label": "R_359\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_359\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e power_factor NOT within PPA limits OR NOT within Reactive Power Capability Curve\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Section 5.8.3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators must supply full active power within specified power factor limits defined in the PPA and their capability curve."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_360", "label": "R_360\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_360\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e automatic_excitation_control_system NOT present\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Section 5.8.3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators must be equipped with continuously acting automatic excitation control systems to maintain terminal voltage stability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_362", "label": "R_362\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_362\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e black_start_capable = false\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 5.8.5 Black Start Capability\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Lack of Black Start capability prevents system recovery after outages."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_364", "label": "R_364\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_364\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003c 47.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Frequency Response\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e VRE Generating Units must remain connected for at least 5 seconds if frequency momentarily drops below 47.5 Hz to avoid unnecessary disconnections."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_365", "label": "R_365\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_365\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e 52.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Grid Documentation, Frequency Response\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e VRE Generating Units may disconnect from the grid if frequency exceeds 52.0 Hz to prevent equipment damage during over-frequency events."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_369", "label": "R_369\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_369\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e 51.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e evsjv\u2021`k \u2020M\u2021RU, AwZwi\u00b3, gvP\u00a9 3, 2024 2071\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e When system frequency exceeds 51.0 Hz, active power must be reduced using \u0394P = 33 * P_m * (51.0 - f) / 50 to stabilize the grid."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_370", "label": "R_370\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_370\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e= 0.9\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The VRE Generating Plant must remain connected indefinitely during three-phase faults up to fault clearance when voltage is equal to or above 90% of nominal."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_371", "label": "R_371\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_371\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e 0.3 \u003c= voltage_pu \u003c= 0.9\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e DISCONNECT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The source text specifies the time is determined by linear interpolation between 30% and 90% voltage thresholds, not that the plant must disconnect within that range."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_373", "label": "R_373\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_373\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e fault_exists OR voltage_recovery_period\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e The source text restricts reactive power consumption to the first 150 milliseconds after fault initiation and during voltage recovery, not exclusively during those periods."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_374", "label": "R_374\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_374\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e (fault_initiation_time \u003c 150ms OR fault_clearing_time \u003c 150ms) AND reactive_power_consumption_pu \u003c= 0.6\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Reactive power consumption by VRE Generating Plant is limited to 60% of nominal capacity during specific fault periods to prevent instability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_375", "label": "R_375\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_375\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e (fault_exists OR voltage_recovery_period) AND active_power_consumption_pu \u003e 0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Active power consumption by VRE Generating Plant is prohibited during fault and recovery periods to avoid grid instability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_376", "label": "R_376\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_376\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 0.9\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage below 0.9 p.u. requires no disconnection to maintain grid integrity during fault conditions."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_377", "label": "R_377\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_377\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e (fault_period OR recovery_period) AND current_injection_pu \u003c max_possible\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e VRE Generating Plant must inject maximum possible current during fault and recovery periods to support grid stability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_384", "label": "R_384\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_384\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e 52 OR frequency_hz \u003c 47.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018, Section 8.3.1.5\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators must protect their units from damage if frequency exceeds 52 Hz or drops below 47.5 Hz."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_385", "label": "R_385\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_385\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003c 47.5 OR frequency_hz \u003e 52.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Page 1; 8.3.2.5\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators must protect against damage from frequency excursions outside 47.5 Hz to 52 Hz."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_389", "label": "R_389\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_389\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_deviation \u003e 0.05Hz OR frequency_deviation \u003c -0.05Hz\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e RESPOND_WITHIN_2S\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Governor. (e)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Governors must respond to frequency deviations exceeding the dead band to maintain stability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_390", "label": "R_390\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_390\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e islanded_mode = true AND frequency_outside_specified_range\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Governor. (g)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Governor control systems must maintain frequency within acceptable limits during islanded operation."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_393", "label": "R_393\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_393\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e (droop_pct \u003c 4 OR droop_pct \u003e 6) AND thermal_unit OR (droop_pct \u003c 2 OR droop_pct \u003e 3) AND hydro_unit\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Section 8.3.2.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Governors in FGMO mode must have droop settings within 4-6% for thermal units and 2-3% for hydro units to ensure proper frequency response."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_394", "label": "R_394\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_394\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e droop_pct BETWEEN 4 AND 6 FOR THERMAL UNITS OR BETWEEN 2 AND 3 FOR HYDRO UNITS\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 8.3.2.1\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Maintains stable frequency regulation through appropriate droop settings for different generator types."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_396", "label": "R_396\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_396\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e secondary_response_time \u003c= 30s\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 8.3.2.3\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Guarantees secondary frequency regulation takes over within 30 seconds to sustain grid stability."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_397", "label": "R_397\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_397\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e 50.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 8.3.2.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Triggers immediate action to reduce frequency when it exceeds 50.5Hz to prevent system instability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_401", "label": "R_401\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_401\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e (droop_pct \u003c 4.0 OR droop_pct \u003e 6.0) AND unit_type == \u0027thermal\u0027 OR (droop_pct \u003c 2.0 OR droop_pct \u003e 3.0) AND unit_type == \u0027hydro\u0027\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 8.3.3.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Governor systems must operate with droop within 2-3% for hydro units and 4-6% for thermal units in FGMO."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_402", "label": "R_402\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_402\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003c 49.25\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e DISCONNECT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e 8.3.3.9\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Disconnect feeders to stabilize system frequency when it falls below 49.25 Hz."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_410", "label": "R_410\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_410\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Transformer\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e capacity_mva \u003e= 1.6\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text, Section 12.9.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Backup time-lag over-current and earth-fault protection (with directional feature for parallel operations) is required for transformers with capacity 1.6 MVA and above."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_414", "label": "R_414\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_414\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e governor_parameters_out_of_limits\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Page 84, Section 14.5.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Ensuring governor parameters are within acceptable limits to maintain proper frequency response."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_416", "label": "R_416\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_416\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e reactive_power_pct \u003e= -5 AND reactive_power_pct \u003c= 5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e VRE Generating Plant Test Requirements, Section 14.6.2(a)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e To ensure the VRE Generating Plant meets reactive power capability requirements as specified in the test."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_417", "label": "R_417\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_417\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e active_power_response_pct \u003e= -5 AND active_power_response_pct \u003c= 5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e VRE Generating Plant Test Requirements, Section 14.6.2(b)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e To ensure the VRE Generating Plant meets active power control response requirements within specified timeframes."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_418", "label": "R_418\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_418\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e= 0.99 AND voltage_pu \u003c= 1.01\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e VRE Generating Plant Test Requirements, Section 14.6.2(c)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e To ensure the VRE Generating Plant maintains voltage at the Connection Point within \u00b10.01 p.u. in voltage control mode."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_426", "label": "R_426\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_426\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e assessment_period == 10_minutes\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Short-term flicker severity must be computed over a 10-minute period for accurate disturbance assessment."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_428", "label": "R_428\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_428\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_imbalance_pct \u003e 2.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text, voltage imbalance paragraph\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage imbalance exceeding 2% is not permitted unless under specific Connection Agreement terms."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_433", "label": "R_433\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_433\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 0.70\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e DISCONNECT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Clause 6.4.1 and Table 2.2 in IEEE Std 1547-2018\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Undervoltage below 0.70 pu necessitates tripping within 2.0 seconds to avoid system instability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_437", "label": "R_437\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_437\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e= 1.10 AND voltage_pu \u003c= 1.20\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018, Table 2.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage within this range for OV1 requires coordination with clearing time settings."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_438", "label": "R_438\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_438\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c= 0.88\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018, Table 2.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage below this threshold for UV1 requires coordination with clearing time settings."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_439", "label": "R_439\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_439\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c= 0.50\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018, Table 2.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Voltage below this threshold for UV2 requires coordination with clearing time settings."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_444", "label": "R_444\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_444\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 0.5\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018, Section 6.5.1 and 6.5.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e DERs in Category III must ride through voltage dips below 0.5 pu during momentary cessation mode."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_446", "label": "R_446\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_446\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_hz \u003e 66.0 OR frequency_hz \u003c 61.0 OR clearing_time_sec \u003e 1000.0 OR clearing_time_sec \u003c 180.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018, Section 7.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e DER must trip when frequency or clearing time exceeds specified thresholds to prevent instability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_449", "label": "R_449\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_449\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e rocof_hz_per_s \u003c= 3.0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE 1547-2018, Table 21 (Table 2.4)\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e DERs must not trip during frequency excursions with ROCOF less than or equal to specified thresholds (0.5, 2.0, 3.0 Hz/s for Categories I, II, III) to maintain grid stability."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_452", "label": "R_452\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_452\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c lower_continuous_operation_voltage\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Clause 4.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e DER must continue dynamic voltage support and restore active current within 0.4s if voltage is below lower continuous operation region"}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_453", "label": "R_453\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_453\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003e lower_continuous_operation_voltage AND time_elapsed \u003e 5s\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e REDISPATCH\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Clause 4.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e DER must discontinue dynamic voltage support and resume reactive power functionality after 5s when voltage surpasses lower continuous operation region"}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_456", "label": "R_456\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_456\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e frequency_pu \u003e threshold_frequency\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018, Section 7.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Proportional reduction of active power above a frequency threshold helps support BPS frequency control during abnormal conditions."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_460", "label": "R_460\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_460\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e kOF \u003c 0.03 OR kOF \u003e 0.05\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE 1547-2018, Table 24\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Frequency droop values must not be set below 0.03 or above 0.05 to maintain proper power sharing."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_461", "label": "R_461\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_461\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e kUF \u003c 0.03 OR kUF \u003e 0.05\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE 1547-2018, Table 24\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Frequency droop values must not be set below 0.03 or above 0.05 to maintain proper power sharing."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_462", "label": "R_462\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_462\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e T \u003c 0.2 OR T \u003e 10\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE 1547-2018, Table 24\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Open-loop response time must remain within 0.2 to 10 seconds to ensure timely frequency response."}, {"color": "#d0021b", "font": {"color": "#e0e0e0"}, "id": "R_464", "label": "R_464\n(critical)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_464\u003c/b\u003e [CRITICAL]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e positive_sequence_angle_deg \u003c= 20 AND individual_phase_angle_deg \u003c 60\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018, Section 7.4\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Multi-phase DER must remain operational during phase angle changes within specified thresholds to maintain grid stability."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_469", "label": "R_469\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_469\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Grid\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e clearing_time_seconds \u003e 2\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018, Clause 8.1.2\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Clearing time for UI prevention may be extended up to five seconds with mutual agreement between the area EPS operator and the DER owner."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_471", "label": "R_471\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_471\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 0.9 OR voltage_pu \u003e 1.1\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e DISCONNECT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e NERC/WECC disturbance report\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Inverters are configured to momentarily cease current injection when voltages fall outside the 0.9\u20131.1 pu continuous operating range."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_474", "label": "R_474\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_474\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e voltage_pu \u003c 0.9\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text provided\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e When voltage drops below 0.9 pu, control logic freezes to prevent controller windup and inverters enter cessation or ride-through mode."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_477", "label": "R_477\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_477\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e ramp_rate \u003e max_allowed_ramp_rate\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e NERC | Inverter-Based\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e BAs specify ramp rate limits to prevent excessive power output changes during normal operation."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_485", "label": "R_485\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_485\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e reactive_power_mvar \u003e= 0.33 * active_power_mw\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e FERC\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Generators must provide reactive power proportional to active power output (33% of active power) to maintain power factor requirements at all output levels."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_493", "label": "R_493\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_493\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e active_power_pu == 0\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Reactive power capability at zero active power output may be less than 100% due to hardware, software, or design limitations."}, {"color": "#9b9b9b", "font": {"color": "#e0e0e0"}, "id": "R_495", "label": "R_495\n(low)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_495\u003c/b\u003e [LOW]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Generator\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e p_mw \u003c 0.05\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e OTHER\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e IEEE Std 1547-2018\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e IEEE Std 1547-2018 does not require reactive power capability for active power output less than 5 percent."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_498", "label": "R_498\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_498\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e negative_sequence_current_pct \u003e 2\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e ALERT\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e Text: ion and GSU protection: 69 Typically monitoring for ~2 percent long-term/continuous negative sequence current\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Excessive negative sequence current can damage capacitors and other electrical components in the system."}, {"color": "#e88a00", "font": {"color": "#e0e0e0"}, "id": "R_502", "label": "R_502\n(high)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_502\u003c/b\u003e [HIGH]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e ProtectionDevice\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e reverse_current \u003e inverter_reverse_current_rating OR reverse_current \u003e pv_module_reverse_current_rating\u003cbr\u003e\u003cb\u003eAction:\u003c/b\u003e BLOCK\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e UL Std. 174185\u003cbr\u003e\u003cb\u003eExplanation:\u003c/b\u003e Instantaneous tripping should not be used unless reverse current exceeds inverter or PV module ratings to avoid unnecessary tripping during transient conditions."}, {"color": "#f5d020", "font": {"color": "#e0e0e0"}, "id": "R_505", "label": "R_505\n(medium)", "shape": "diamond", "size": 18, "title": "\u003cb\u003eR_505\u003c/b\u003e [MEDIUM]\u003cbr\u003e\u003cb\u003eEntity:\u003c/b\u003e Bus\u003cbr\u003e\u003cb\u003eCondition:\u003c/b\u003e samplin
