<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="a-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#0E7A5F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .t  { font-size: 13px; font-weight: 700; }
    .s  { font-size: 10px; font-weight: 400; }
    .m  { font-size: 9px;  font-weight: 400; }
    .kicker { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; }
    .mono { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 600; }
    .footb  { font-size: 11px; font-weight: 700; fill: #1a1a1a; }
    .fn  { stroke: #0E7A5F; stroke-width: 1.5; fill: none; marker-end: url(#a-n); }
    .fnh { stroke: #0E7A5F; stroke-width: 1.5; fill: none; marker-end: url(#a-n); }
  </style>
</defs>

<rect x="0" y="0" width="720" height="580" fill="#ffffff"/>

<text class="kicker" x="360" y="26" text-anchor="middle" fill="#0E7A5F">COMPONENT A &#8212; GRAPH NEURAL NETWORK</text>

<!-- ── input ─────────────────────────────────────────────────────────── -->
<rect x="210" y="44" width="300" height="56" rx="7" fill="#E6F4EF" stroke="#0E7A5F" stroke-width="1.4"/>
<text class="t" x="360" y="68" text-anchor="middle" fill="#0A5C47">Grid state as a graph</text>
<text class="s" x="360" y="85" text-anchor="middle" fill="#0A5C47">8 measurements per substation (node) &#183; 8 per line (edge)</text>

<path class="fn" d="M360 100 V122"/>

<!-- ── three attention layers ────────────────────────────────────────── -->
<rect x="40"  y="124" width="200" height="60" rx="7" fill="#E6F4EF" stroke="#0E7A5F" stroke-width="1.4"/>
<text class="t" x="140" y="148" text-anchor="middle" fill="#0A5C47">GATv2Conv &#183; layer 1</text>
<text class="s" x="140" y="165" text-anchor="middle" fill="#0A5C47">16 channels &#215; 4 heads</text>

<rect x="260" y="124" width="200" height="60" rx="7" fill="#E6F4EF" stroke="#0E7A5F" stroke-width="1.4"/>
<text class="t" x="360" y="148" text-anchor="middle" fill="#0A5C47">GATv2Conv &#183; layer 2</text>
<text class="s" x="360" y="165" text-anchor="middle" fill="#0A5C47">32 channels &#215; 4 heads</text>

<rect x="480" y="124" width="200" height="60" rx="7" fill="#E6F4EF" stroke="#0E7A5F" stroke-width="1.4"/>
<text class="t" x="580" y="148" text-anchor="middle" fill="#0A5C47">GATv2Conv &#183; layer 3</text>
<text class="s" x="580" y="165" text-anchor="middle" fill="#0A5C47">32 channels &#215; 1 head</text>

<path class="fnh" d="M240 154 H260"/>
<path class="fnh" d="M460 154 H480"/>

<text class="m" x="360" y="203" text-anchor="middle" fill="#3F8C77">each layer scores attention dynamically (GATv2 &#8212; after node and edge features combine)</text>
<text class="m" x="360" y="216" text-anchor="middle" fill="#3F8C77">followed by batch normalisation on live batch statistics, then an ELU activation</text>

<path class="fn" d="M360 224 V246"/>

<!-- ── per-line readout ──────────────────────────────────────────────── -->
<rect x="90" y="248" width="540" height="84" rx="7" fill="#E6F4EF" stroke="#0E7A5F" stroke-width="1.4"/>
<text class="t" x="360" y="272" text-anchor="middle" fill="#0A5C47">Per-line readout &#8212; nothing is pooled</text>
<text class="s" x="360" y="289" text-anchor="middle" fill="#0A5C47">for every line: concatenate both endpoint embeddings + this line's edge features + both endpoints' raw features</text>
<text class="m" x="360" y="306" text-anchor="middle" fill="#3F8C77">keeps each prediction local, so one trained network runs unchanged on a grid of any size</text>

<path class="fn" d="M360 332 V344"/>

<rect x="210" y="344" width="300" height="40" rx="6" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="3,2"/>
<text class="mono" x="360" y="369" text-anchor="middle" fill="#2a2a2a">[ h_or &#8214; h_ex &#8214; edge_attr &#8214; x_or &#8214; x_ex ]</text>

<path class="fn" d="M360 384 V406"/>

<!-- ── mlp head ──────────────────────────────────────────────────────── -->
<rect x="260" y="408" width="200" height="54" rx="7" fill="#E6F4EF" stroke="#0E7A5F" stroke-width="1.4"/>
<text class="t" x="360" y="432" text-anchor="middle" fill="#0A5C47">Feed-forward head</text>
<text class="s" x="360" y="449" text-anchor="middle" fill="#0A5C47">128 &#8594; 64 &#8594; 1</text>

<path class="fn" d="M360 462 V484"/>

<!-- ── output ────────────────────────────────────────────────────────── -->
<rect x="185" y="486" width="350" height="54" rx="7" fill="#F4F4F4" stroke="#8A8A8A" stroke-width="1.4"/>
<text class="t" x="360" y="510" text-anchor="middle" fill="#2a2a2a">One prediction per line</text>
<text class="s" x="360" y="527" text-anchor="middle" fill="#4a4a4a">probability that tripping this line causes a violation elsewhere</text>

<text class="footb" x="360" y="562" text-anchor="middle">Weights are trained once and frozen; the same checkpoint runs on any grid without fine-tuning.</text>

</svg>
