<svg width="100%" viewBox="0 0 800 760" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: Arial, sans-serif; fill: #1a1a1a; }
    .ph  { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; }
    .th  { font-size: 11.5px; font-weight: 600; }
    .ts  { font-size: 10.5px; font-weight: 400; fill: #444; }
    .tlabel { font-size: 10px; font-weight: 500; }
    .arr { stroke: #888; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    .arr-dark { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow-dark); }
    .arr-dash { stroke: #aaa; stroke-width: 1; stroke-dasharray: 4 3; fill: none; marker-end: url(#arrow); }
  </style>
</defs>

<!-- ═══════════════════════════════════════════════════════
     PHASE LABEL BADGES (left margin)
     ═══════════════════════════════════════════════════════ -->

<!-- Phase A badge -->
<rect x="16" y="28" width="12" height="160" rx="4" fill="#7F77DD"/>
<text class="ph" x="22" y="122" text-anchor="middle" fill="#7F77DD"
      transform="rotate(-90,22,122)" style="font-size:11px;letter-spacing:1px">PHASE A</text>

<!-- Phase B badge -->
<rect x="16" y="222" width="12" height="160" rx="4" fill="#185FA5"/>
<text class="ph" x="22" y="312" text-anchor="middle" fill="#185FA5"
      transform="rotate(-90,22,312)" style="font-size:11px;letter-spacing:1px">PHASE B</text>

<!-- Phase C badge -->
<rect x="16" y="416" width="12" height="300" rx="4" fill="#BA7517"/>
<text class="ph" x="22" y="566" text-anchor="middle" fill="#BA7517"
      transform="rotate(-90,22,566)" style="font-size:11px;letter-spacing:1px">PHASE C</text>


<!-- ═══════════════════════════════════════════════════════
     PHASE A — Symbolic Knowledge Pipeline
     ═══════════════════════════════════════════════════════ -->
<rect x="38" y="20" width="742" height="170" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text class="ph" x="409" y="42" text-anchor="middle" fill="#26215C">Phase A — Symbolic Knowledge Pipeline</text>

<!-- Source Docs -->
<rect x="56" y="56" width="116" height="116" rx="7" fill="#F4F2EC" stroke="#7F77DD" stroke-width="0.6"/>
<text class="th" x="114" y="76" text-anchor="middle" fill="#26215C">Source documents</text>
<text class="ts" x="114" y="93" text-anchor="middle">IEEE Std 1547 / C37.2</text>
<text class="ts" x="114" y="108" text-anchor="middle">NERC FAC-001/002</text>
<text class="ts" x="114" y="123" text-anchor="middle">AEMO PSR 2020</text>
<text class="ts" x="114" y="138" text-anchor="middle">Op. manuals</text>
<text class="ts" x="114" y="153" text-anchor="middle" fill="#888">PDF / text</text>

<!-- Arrow docs → extractor -->
<line x1="172" y1="114" x2="198" y2="114" class="arr" stroke="#888"/>

<!-- Extractor LLM -->
<rect x="198" y="56" width="140" height="116" rx="7" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text class="th" x="268" y="76" text-anchor="middle" fill="#26215C">Extractor LLM</text>
<text class="ts" x="268" y="93" text-anchor="middle">Qwen3-14B (4-bit)</text>
<text class="ts" x="268" y="108" text-anchor="middle">GPU-resident</text>
<text class="ts" x="268" y="124" text-anchor="middle">High-recall extraction</text>
<text class="ts" x="268" y="140" text-anchor="middle">→ JSON candidates</text>
<text class="ts" x="268" y="155" text-anchor="middle" fill="#7F77DD">GBNF schema guard</text>

<!-- Arrow extractor → validator -->
<line x1="338" y1="114" x2="364" y2="114" class="arr" stroke="#888"/>

<!-- Validator LLM -->
<rect x="364" y="56" width="140" height="116" rx="7" fill="#FAE8FE" stroke="#9B3EC8" stroke-width="0.8"/>
<text class="th" x="434" y="76" text-anchor="middle" fill="#4A1275">Validator LLM</text>
<text class="ts" x="434" y="93" text-anchor="middle">Nemotron 3 Nano 30B</text>
<text class="ts" x="434" y="108" text-anchor="middle">MoE · A3B active params</text>
<text class="ts" x="434" y="124" text-anchor="middle">Cross-arch verification</text>
<text class="ts" x="434" y="140" text-anchor="middle">CONFIRM / REJECT /</text>
<text class="ts" x="434" y="155" text-anchor="middle">CORRECT / FLAG</text>

<!-- Arrow validator → KG -->
<line x1="504" y1="114" x2="530" y2="114" class="arr" stroke="#888"/>

<!-- Knowledge Graph block -->
<rect x="530" y="56" width="148" height="116" rx="7" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="604" y="76" text-anchor="middle" fill="#04342C">Knowledge graph</text>
<text class="ts" x="604" y="93" text-anchor="middle">NetworkX DiGraph</text>
<text class="ts" x="604" y="109" text-anchor="middle">Bus / Line / Rule nodes</text>
<text class="ts" x="604" y="125" text-anchor="middle">has_rule edges</text>
<text class="ts" x="604" y="141" text-anchor="middle">condition · severity</text>
<text class="ts" x="604" y="156" text-anchor="middle" fill="#0F6E56">source · rule_id</text>

<!-- Flag box -->
<rect x="692" y="70" width="76" height="52" rx="5" fill="#FFF3CD" stroke="#D4841A" stroke-width="0.6"/>
<text class="tlabel" x="730" y="88" text-anchor="middle" fill="#633806">Flag</text>
<text class="ts" x="730" y="103" text-anchor="middle" style="font-size:10px">manual</text>
<text class="ts" x="730" y="116" text-anchor="middle" style="font-size:10px">review</text>
<!-- Dashed arrow: validator → flag -->
<line x1="504" y1="88" x2="690" y2="88" class="arr-dash" stroke="#D4841A"/>


<!-- ═══════════════════════════════════════════════════════
     PHASE B — Neural Perception Pipeline
     ═══════════════════════════════════════════════════════ -->
<rect x="38" y="214" width="742" height="166" rx="10" fill="#E4EFF9" stroke="#185FA5" stroke-width="1"/>
<text class="ph" x="409" y="235" text-anchor="middle" fill="#042C53">Phase B — Neural Perception Pipeline (GNN)</text>

<!-- Grid2Op Sim -->
<rect x="56" y="250" width="140" height="112" rx="7" fill="#F4F2EC" stroke="#185FA5" stroke-width="0.6"/>
<text class="th" x="126" y="272" text-anchor="middle" fill="#2C2C2A">Grid2Op simulation</text>
<text class="ts" x="126" y="290" text-anchor="middle">NeurIPS 2020 36-bus</text>
<text class="ts" x="126" y="305" text-anchor="middle">LightSimBackend</text>
<text class="ts" x="126" y="321" text-anchor="middle">59 lines · fault inj.</text>
<text class="ts" x="126" y="337" text-anchor="middle" fill="#888">obs: ρ, V, P, Q, status</text>

<!-- Arrow sim → graph builder -->
<line x1="196" y1="306" x2="222" y2="306" class="arr" stroke="#888"/>

<!-- Graph Builder -->
<rect x="222" y="250" width="140" height="112" rx="7" fill="#E4EFF9" stroke="#185FA5" stroke-width="0.7"/>
<text class="th" x="292" y="272" text-anchor="middle" fill="#042C53">Graph builder</text>
<text class="ts" x="292" y="290" text-anchor="middle">Nodes = buses (36)</text>
<text class="ts" x="292" y="305" text-anchor="middle">Edges = lines (59)</text>
<text class="ts" x="292" y="321" text-anchor="middle">Node feat: load_p, V,</text>
<text class="ts" x="292" y="336" text-anchor="middle">max_ρ, conn_frac</text>
<text class="ts" x="292" y="350" text-anchor="middle">Edge feat: ρ, P, Q, status</text>

<!-- Arrow graph builder → GAT -->
<line x1="362" y1="306" x2="388" y2="306" class="arr" stroke="#888"/>

<!-- GAT Model -->
<rect x="388" y="250" width="152" height="112" rx="7" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text class="th" x="464" y="272" text-anchor="middle" fill="#4A1B0C">GAT — PyG</text>
<text class="ts" x="464" y="290" text-anchor="middle">3× GATConv layers</text>
<text class="ts" x="464" y="305" text-anchor="middle">BatchNorm · ELU</text>
<text class="ts" x="464" y="321" text-anchor="middle">global_mean/max/min</text>
<text class="ts" x="464" y="337" text-anchor="middle">pool concat</text>
<text class="ts" x="464" y="352" text-anchor="middle" fill="#993C1D">attention edge weights</text>

<!-- Arrow GAT → Prediction -->
<line x1="540" y1="306" x2="566" y2="306" class="arr" stroke="#888"/>

<!-- Prediction -->
<rect x="566" y="250" width="196" height="112" rx="7" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text class="th" x="664" y="272" text-anchor="middle" fill="#4A1B0C">Prediction output</text>
<text class="ts" x="664" y="290" text-anchor="middle">class: normal / overload /</text>
<text class="ts" x="664" y="305" text-anchor="middle">line_trip / cascade</text>
<text class="ts" x="664" y="322" text-anchor="middle">loc: top-k fault buses</text>
<text class="ts" x="664" y="338" text-anchor="middle">confidence score</text>
<text class="ts" x="664" y="354" text-anchor="middle" fill="#993C1D">class_logits + loc_logits</text>


<!-- ═══════════════════════════════════════════════════════
     PHASE C — Neuro-Symbolic Integration (Shield)
     ═══════════════════════════════════════════════════════ -->
<rect x="38" y="408" width="742" height="310" rx="10" fill="#FDF3E3" stroke="#BA7517" stroke-width="1"/>
<text class="ph" x="409" y="430" text-anchor="middle" fill="#412402">Phase C — Neuro-Symbolic Integration (Shield Layer)</text>

<!-- Context builder -->
<rect x="56" y="448" width="164" height="108" rx="7" fill="#F4F2EC" stroke="#BA7517" stroke-width="0.6"/>
<text class="th" x="138" y="468" text-anchor="middle" fill="#412402">Context builder</text>
<text class="ts" x="138" y="486" text-anchor="middle">Raw obs values</text>
<text class="ts" x="138" y="501" text-anchor="middle">(un-normalised)</text>
<text class="ts" x="138" y="517" text-anchor="middle">ρ, V_kV, line_status</text>
<text class="ts" x="138" y="533" text-anchor="middle">GNN label + confidence</text>
<text class="ts" x="138" y="548" text-anchor="middle" fill="#888">top_k_buses</text>

<!-- Arrow context → KG query -->
<line x1="220" y1="502" x2="246" y2="502" class="arr" stroke="#888"/>

<!-- KG Query / Rule Retrieval -->
<rect x="246" y="448" width="164" height="108" rx="7" fill="#FDF3E3" stroke="#BA7517" stroke-width="0.7"/>
<text class="th" x="328" y="468" text-anchor="middle" fill="#412402">KG rule retrieval</text>
<text class="ts" x="328" y="486" text-anchor="middle">Traverse has_rule edges</text>
<text class="ts" x="328" y="501" text-anchor="middle">Filter by entity type</text>
<text class="ts" x="328" y="517" text-anchor="middle">(Bus / Line / Grid)</text>
<text class="ts" x="328" y="533" text-anchor="middle">Returns Rule nodes</text>
<text class="ts" x="328" y="548" text-anchor="middle" fill="#888">with conditions + severity</text>

<!-- Arrow KG retrieval → condition eval -->
<line x1="410" y1="502" x2="436" y2="502" class="arr" stroke="#888"/>

<!-- Condition Evaluator -->
<rect x="436" y="448" width="164" height="108" rx="7" fill="#FDF3E3" stroke="#BA7517" stroke-width="0.7"/>
<text class="th" x="518" y="468" text-anchor="middle" fill="#412402">Condition evaluator</text>
<text class="ts" x="518" y="486" text-anchor="middle">eval() + strict namespace</text>
<text class="ts" x="518" y="501" text-anchor="middle">voltage_pu = V/150</text>
<text class="ts" x="518" y="517" text-anchor="middle">loading_pct = ρ × 100</text>
<text class="ts" x="518" y="533" text-anchor="middle">Severity ordering:</text>
<text class="ts" x="518" y="548" text-anchor="middle" fill="#993C1D">critical &gt; high &gt; medium &gt; low</text>

<!-- Arrow condition → decision -->
<line x1="600" y1="502" x2="626" y2="502" class="arr" stroke="#888"/>

<!-- PASS / BLOCK Decision -->
<rect x="626" y="448" width="136" height="108" rx="7" fill="#FDF3E3" stroke="#BA7517" stroke-width="0.8"/>
<text class="th" x="694" y="468" text-anchor="middle" fill="#412402">Shield decision</text>
<text class="ts" x="694" y="486" text-anchor="middle" fill="#0A6640" style="font-weight:600">PASS</text>
<text class="ts" x="694" y="501" text-anchor="middle">→ forward prediction</text>
<line x1="650" y1="512" x2="750" y2="512" stroke="#ddd" stroke-width="0.8"/>
<text class="ts" x="694" y="525" text-anchor="middle" fill="#A52020" style="font-weight:600">BLOCK</text>
<text class="ts" x="694" y="540" text-anchor="middle">→ suppress + explain</text>
<text class="ts" x="694" y="554" text-anchor="middle" fill="#888">cite rule_id + source</text>

<!-- ─── Explanation trace sub-panel ─── -->
<rect x="56" y="580" width="742" height="118" rx="7" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.7"/>
<text class="th" x="427" y="600" text-anchor="middle" fill="#173404">Explanation trace  (BLOCK path)</text>

<rect x="72" y="612" width="196" height="74" rx="5" fill="#F4F8EE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th" x="170" y="631" text-anchor="middle" fill="#2C2C2A">Rule citation</text>
<text class="ts" x="170" y="648" text-anchor="middle">Rule R_042 (CRITICAL):</text>
<text class="ts" x="170" y="663" text-anchor="middle">voltage_pu &lt; 0.95 violated</text>
<text class="ts" x="170" y="677" text-anchor="middle" fill="#3B6D11">Source: IEEE 1547-2018 §7.4</text>

<line x1="268" y1="649" x2="288" y2="649" class="arr" stroke="#3B6D11"/>

<rect x="288" y="612" width="196" height="74" rx="5" fill="#F4F8EE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th" x="386" y="631" text-anchor="middle" fill="#2C2C2A">Context snapshot</text>
<text class="ts" x="386" y="648" text-anchor="middle">ρ_max = 1.21 (Line 7)</text>
<text class="ts" x="386" y="663" text-anchor="middle">V_min = 0.91 pu (Bus 5)</text>
<text class="ts" x="386" y="677" text-anchor="middle" fill="#3B6D11">n_tripped = 2 lines</text>

<line x1="484" y1="649" x2="504" y2="649" class="arr" stroke="#3B6D11"/>

<rect x="504" y="612" width="270" height="74" rx="5" fill="#F4F8EE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th" x="639" y="631" text-anchor="middle" fill="#2C2C2A">Human-readable explanation</text>
<text class="ts" x="639" y="648" text-anchor="middle">"ACTION BLOCKED: Switch OFF Line 3-4</text>
<text class="ts" x="639" y="663" text-anchor="middle">Rule R_042 violated: V at Bus 5 = 0.91 pu.</text>
<text class="ts" x="639" y="677" text-anchor="middle" fill="#3B6D11">Minimum 0.95 pu · IEEE 1547-2018 §7.4"</text>


