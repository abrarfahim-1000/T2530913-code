<path d="M664 362 L664 394 L138 394 L138 447"
      stroke="#993C1D" stroke-width="1.3" fill="none"
      marker-end="url(#arrow-dark)"/>
<text class="tlabel" x="405" y="390" text-anchor="middle" fill="#993C1D" style="font-size:10px">GNN prediction + raw obs</text>

<!-- Shield decision → Explanation trace -->
<line x1="694" y1="556" x2="694" y2="578" class="arr-dark" stroke="#BA7517"/>


